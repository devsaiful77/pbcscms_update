<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Nirmala UI, Vrinda, Shonar Bangla, Noto Sans Bengali, sans-serif">
    <defs>
        <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0b6e4f"/>
            <stop offset="0.55" stop-color="#7a5c1e"/>
            <stop offset="1" stop-color="#8b1e3f"/>
        </linearGradient>
        <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
            <line x1="0" y1="0" x2="0" y2="10" stroke="#0b6e4f" stroke-width="1.2"/>
        </pattern>
    </defs>

    <!-- note body -->
    <rect x="6" y="6" width="628" height="308" rx="18" fill="none" stroke="url(#paper)" stroke-width="6"/>
    <rect x="22" y="22" width="596" height="276" rx="10" fill="none" stroke="url(#paper)" stroke-width="2" stroke-dasharray="2 5"/>
    <rect x="34" y="34" width="572" height="252" rx="8" fill="url(#lines)" opacity="0.35"/>

    <!-- guilloche rosette (left) -->
    <g transform="translate(150 160)" fill="none" stroke="#0b6e4f" stroke-width="1.4">
        <ellipse rx="95" ry="38"/>
        <ellipse rx="95" ry="38" transform="rotate(30)"/>
        <ellipse rx="95" ry="38" transform="rotate(60)"/>
        <ellipse rx="95" ry="38" transform="rotate(90)"/>
        <ellipse rx="95" ry="38" transform="rotate(120)"/>
        <ellipse rx="95" ry="38" transform="rotate(150)"/>
        <circle r="70" stroke="#8b1e3f" stroke-width="2"/>
        <circle r="58" stroke-dasharray="3 4"/>
    </g>
    <text x="150" y="190" text-anchor="middle" font-size="96" font-weight="700" fill="#0b6e4f">৳</text>

    <!-- red & green disc motif -->
    <rect x="300" y="60" width="96" height="58" rx="4" fill="#0b6e4f"/>
    <circle cx="342" cy="89" r="19" fill="#c8102e"/>

    <!-- denomination -->
    <text x="590" y="92" text-anchor="end" font-size="64" font-weight="800" fill="#8b1e3f">১০০০</text>
    <text x="590" y="285" text-anchor="end" font-size="40" font-weight="700" fill="#0b6e4f">1000</text>
    <text x="54" y="70" font-size="30" font-weight="800" fill="#8b1e3f">১০০০</text>

    <!-- title -->
    <text x="420" y="170" text-anchor="middle" font-size="46" font-weight="700" fill="#0b6e4f">এক হাজার টাকা</text>
    <text x="420" y="210" text-anchor="middle" font-size="18" letter-spacing="6" fill="#7a5c1e">ONE THOUSAND TAKA</text>

    <!-- guilloche band (bottom) -->
    <g fill="none" stroke="#8b1e3f" stroke-width="1.2">
        <path d="M290 248 q 20 -24 40 0 t 40 0 t 40 0 t 40 0 t 40 0"/>
        <path d="M290 256 q 20 24 40 0 t 40 0 t 40 0 t 40 0 t 40 0"/>
    </g>
</svg>
